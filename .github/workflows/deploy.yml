name: Deploy

# Manual: run it from the Actions tab (or tag a release). The very first deployment is easier from
# your own machine, see "部署" in the README, because it provisions D1 + R2 and sets the secrets.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Repository secrets. The API token needs: Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm ci
      - run: pnpm run typecheck && pnpm test
      # Schema first, code second: migrations are written to be backwards compatible.
      - run: pnpm run db:migrate:remote
      - run: pnpm dlx wrangler deploy
